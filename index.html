<style>
:root{--bg:#f3efe3;--card:#fffdf6;--ink:#1d2b26;--mut:#6b7a73;--green:#0f6b4f;--gold:#b8872b;--line:#ddd5bf;--bad:#b33a3a;--ok:#1f8a5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10201b;--card:#17302a;--ink:#f1ead6;--mut:#9fb3aa;--green:#3fc79a;--gold:#e0b35a;--line:#2a4a41;--bad:#e27a7a;--ok:#4fd29a}}
:root[data-theme="dark"]{--bg:#10201b;--card:#17302a;--ink:#f1ead6;--mut:#9fb3aa;--green:#3fc79a;--gold:#e0b35a;--line:#2a4a41;--bad:#e27a7a;--ok:#4fd29a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,sans-serif;line-height:1.7;max-width:560px;margin-inline:auto;padding-bottom:84px}
h1,h2,h3{font-family:Amiri,serif;margin:0}
.top{padding:18px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:30px;color:var(--green)}
.stats{display:flex;gap:8px;padding:0 16px 8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2px 12px;font-size:14px;font-weight:600}
.lvl{margin:8px 16px;padding:14px;border:2px solid var(--gold);border-radius:14px;background:var(--card)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold)}
.sec{padding:8px 16px}
.track{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;color:var(--ink);font:inherit;cursor:pointer}
.track b{font-family:Amiri,serif;font-size:20px;display:block}
.track small{color:var(--mut)}
.ic{font-family:Amiri,serif;font-size:26px;width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.lesson{display:flex;justify-content:space-between;width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px;color:var(--ink);font:inherit;cursor:pointer;text-align:right}
.lesson.done{border-color:var(--ok)}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--green);border:1px solid var(--green)}
.opt{display:block;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;color:var(--ink);font:inherit;font-size:18px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.note{background:var(--card);border-right:4px solid var(--gold);padding:12px;border-radius:8px;font-family:Amiri,serif;font-size:19px}
.q{font-family:Amiri,serif;font-size:22px;margin:14px 0 6px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;font-size:13px;padding:12px 2px;color:var(--mut);font:inherit;font-weight:600;cursor:pointer}
nav button.on{color:var(--green)}
.badge{display:inline-block;margin:4px;padding:6px 12px;border-radius:20px;border:1px dashed var(--line);color:var(--mut)}
.badge.got{border:1px solid var(--gold);color:var(--gold);font-weight:700}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.cert{border:6px double var(--gold);background:var(--card);text-align:center;padding:24px 12px;margin-bottom:14px;border-radius:6px}.cert h1{color:var(--green);margin:6px 0}.cert p{margin:4px 0}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:50%;transform:translateX(50%);background:var(--green);color:#fff;padding:8px 18px;border-radius:20px;font-weight:700;z-index:9}

const LV=["مبتدئ","متعلّم","أديب","لغوي","فصيح","علّامة"];
let S;try{S=JSON.parse(localStorage.getItem("lg")||"null")}catch(e){}
S=S||{xp:0,gems:0,streak:0,last:"",done:{},err:0};
const save=()=>{try{localStorage.setItem("lg",JSON.stringify(S))}catch(e){}};
let prac=false,view="home",tr=0,ls=0,qs=[],qi=0,ok=0,tab="home";
const lvl=()=>Math.min(5,Math.floor(S.xp/200));
const doneCount=t=>Object.keys(S.done).filter(k=>k.startsWith(t+"-")).length;
const total=()=>Object.keys(S.done).length;
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function daily(){const d=new Date().toDateString();if(S.last!==d){const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=d;S.dn=0;S.gems+=5;save();setTimeout(()=>toast("صندوق اليوم: +٥ درر 🎁"),400)}}
function header(){const l=lvl(),nx=(l+1)*200;return `<div class="top"><h1 style="display:flex;align-items:center;gap:8px">${LOGO}لغتي العربية</h1><button class="btn alt" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'">الوضع</button></div>
<div class="stats"><span class="chip">🔥 ${S.streak} يوم</span><span class="chip">💎 ${S.gems} درّة</span><span class="chip">⭐ ${S.xp} نقطة</span></div>`}
function home(){const l=lvl();return header()+`<div class="lvl"><h3>${LV[l]}</h3><small>${l<5?`${S.xp} من ${(l+1)*200} نقطة للمستوى التالي`:"بلغت أعلى مستوى"}</small><div class="bar"><i style="width:${l<5?(S.xp%200)/2:100}%"></i></div></div>
${nextCard()}<div class="sec"><h2>المسارات</h2><p style="margin:2px 0 10px;color:var(--mut)">أتممت ${total()} من ١٢٠ درسًا</p>${T.map((t,i)=>`<button class="track" onclick="openTrack(${i})"><span class="ic">${t.i}</span><span style="flex:1"><b>${t.n}</b><small>${doneCount(i)} / 15 درسًا</small><div class="bar"><i style="width:${doneCount(i)/15*100}%;background:var(--green)"></i></div></span></button>`).join("")}</div>`}
function trackView(){const t=T[tr];return `<div class="top"><button class="btn alt" onclick="go('home')">رجوع</button><h1 style="font-size:24px">${t.n}</h1></div><div class="sec">${t.L.map((x,i)=>`<button class="lesson ${S.done[tr+"-"+i]?"done":""}" onclick="openLesson(${i})"><span>${i+1}. ${x}</span><span>${S.done[tr+"-"+i]?"✅":"◀"}</span></button>`).join("")}</div>`}
function lessonView(){const t=T[tr];return `<div class="top"><button class="btn alt" onclick="go('track')">رجوع</button><h1 style="font-size:22px">${t.L[ls]}</h1></div><div class="sec"><div class="note">${t.D&&t.D[ls]?t.D[ls][0]:t.note}</div><p style="color:var(--mut)">أجب عن الأسئلة لتكسب النقاط والدرر.</p><button class="btn" onclick="startQ()">ابدأ التمرين</button></div>`}
function startQ(){prac=false;const t=T[tr];qs=[...(t.D&&t.D[ls]?t.D[ls][1]:t.Q)].sort(()=>Math.random()-.5).slice(0,3);qi=0;ok=0;go("quiz")}
function quizView(){const q=qs[qi];const o=q[1].map((x,i)=>[x,i]).sort(()=>Math.random()-.5);return `<div class="top"><h1 style="font-size:22px">سؤال ${qi+1} من ${qs.length}</h1></div><div class="sec"><div class="q">${q[0]}</div>${o.map(([x,i])=>`<button class="opt" onclick="ans(this,${i===q[2]})">${x}</button>`).join("")}</div>`}
function ans(b,c){document.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add(c?"ok":"no");if(c)ok++;else S.err++;setTimeout(()=>{qi++;if(qi<qs.length)go("quiz");else finish()},900)}
function finish(){if(prac){const xp=ok*5;S.xp+=xp;S.dn=(S.dn||0)+1;save();view="res";document.getElementById("app").innerHTML=`<div class="top"><h1>انتهى التدريب</h1></div><div class="sec"><div class="lvl"><p>الصحيح: ${ok} من ${qs.length}</p><p>⭐ +${xp} نقطة</p></div><button class="btn" onclick="go('train')">تدريب آخر</button></div>`+nav();return}const perfect=ok===qs.length;const first=!S.done[tr+"-"+ls];const xp=ok*10*(perfect?2:1)+(first?10:0),g=perfect?3:1;S.xp+=xp;S.gems+=g;S.dn=(S.dn||0)+1;if(ok>=2)S.done[tr+"-"+ls]=1;save();view="res";document.getElementById("app").innerHTML=`<div class="top"><h1>${perfect?"ممتاز! 🎉":ok>=2?"أحسنت":"حاول مرة أخرى"}</h1></div><div class="sec"><div class="lvl"><p>الصحيح: ${ok} من ${qs.length}</p><p>⭐ +${xp} نقطة &nbsp; 💎 +${g}</p>${ok<2?"<p>أتمم ٢ على الأقل لإنهاء الدرس.</p>":""}</div><button class="btn" onclick="go('track')">العودة للدروس</button></div>`+nav()}
function profile(){const bs=[["أول درس",total()>=1],["٥ دروس",total()>=5],["٢٥ درسًا",total()>=25],["٥٠ درسًا",total()>=50],["أسبوع متواصل",S.streak>=7],["١٠٠٠ نقطة",S.xp>=1000],...T.map((t,i)=>["وسام "+t.n,doneCount(i)===15])];return header()+`<div class="sec"><h2>الأوسمة</h2>${bs.map(b=>`<span class="badge ${b[1]?"got":""}">${b[1]?"🏅":"🔒"} ${b[0]}</span>`).join("")}<h2 style="margin-top:16px">المتصدرون هذا الأسبوع</h2>${[["سلمى",820],["أنت",S.xp],["يوسف",450],["ليلى",300]].sort((a,b)=>b[1]-a[1]).map((r,i)=>`<div class="row"><span>${i+1}. ${r[0]}</span><b>${r[1]}</b></div>`).join("")}<small style="color:var(--mut)">قائمة تجريبية ولا تمثل لاعبين حقيقيين.</small></div>`}
function shop(){const items=[["تلميح إضافي",3],["تجميد السلسلة",10],["ثيم المخطوطات",25]];return header()+`<div class="sec"><h2>متجر الدرر</h2>${items.map((x,i)=>`<div class="row"><span>${x[0]}</span><button class="btn" onclick="buy(${i},${x[1]})">${x[1]} 💎</button></div>`).join("")}</div>`}
function buy(i,p){if(S.gems<p)return toast("درّرك لا تكفي");S.gems-=p;save();toast("تم الشراء");go("shop")}
function nav(){return `<nav>${[["home","الرئيسية"],["train","التدريب"],["certs","الشهادات"],["profile","الأوسمة"],["shop","المتجر"]].map(x=>`<button class="${tab===x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}</nav>`}
function openTrack(i){tr=i;go("track")}
function nextCard(){let n=null;for(let a=0;a<8&&!n;a++)for(let b=0;b<15;b++)if(!S.done[a+"-"+b]){n=[a,b];break}const g=Math.min(S.dn||0,3);return `<div class="lvl"><b>هدف اليوم: ${g} / 3 تمارين</b><div class="bar"><i style="width:${g/3*100}%"></i></div>${n?`<p style="margin:8px 0 6px">تابع: ${T[n[0]].n} — ${T[n[0]].L[n[1]]}</p><button class="btn" onclick="tr=${n[0]};openLesson(${n[1]})">تابع الدرس</button>`:"<p>أتممت جميع الدروس 🎓</p>"}</div>`}
function train(){return header()+`<div class="sec"><h2>التدريب الحر</h2><p style="color:var(--mut)">٥ أسئلة، و+٥ نقاط لكل إجابة صحيحة، دون التأثير على تقدّم دروسك.</p><button class="track" onclick="startPractice(-1)"><span class="ic">★</span><span><b>تدريب شامل</b><small>أسئلة من كل المسارات</small></span></button>${T.map((t,i)=>`<button class="track" onclick="startPractice(${i})"><span class="ic">${t.i}</span><span><b>${t.n}</b></span></button>`).join("")}<small style="color:var(--mut)">إجاباتك الخاطئة حتى الآن: ${S.err}</small></div>`}
function startPractice(i){prac=true;const pl=t=>[...t.Q,...(t.D||[]).flatMap(d=>d[1])];const p=i<0?T.flatMap(pl):pl(T[i]);qs=[...p].sort(()=>Math.random()-.5).slice(0,5);qi=0;ok=0;go("quiz")}
function certs(){return header()+`<div class="sec"><h2>الشهادات</h2><p>اسمك على الشهادة:</p><input value="${S.name||""}" placeholder="اكتب اسمك" onchange="S.name=this.value;save()" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px">${T.map((t,i)=>{const d=doneCount(i)===15;return `<button class="track" style="opacity:${d?1:.6}" onclick="openCert(${i})"><span class="ic">${d?"🎓":"🔒"}</span><span><b>${t.n}</b><small>${d?"اضغط لعرض الشهادة":doneCount(i)+" / 15 درسًا"}</small></span></button>`}).join("")}</div>`}
function openCert(i){if(doneCount(i)<15)return toast("أتمم ١٥ درسًا أولًا");tr=i;go("cert")}
function certView(){const t=T[tr];return `<div class="top"><button class="btn alt" onclick="go('certs')">رجوع</button></div><div class="sec"><div class="cert"><small>شهادة إتمام</small><h2>لغتي العربية</h2><p>تشهد المنصة بأن</p><h1>${S.name||"المتعلّم"}</h1><p>أتمّ بنجاح مسار</p><h2>${t.n}</h2><p>١٥ درسًا · ${new Date().toLocaleDateString("ar")}</p></div><button class="btn" onclick="share()">مشاركة</button></div>`}
function share(){const m=`أتممت مسار «${T[tr].n}» في تطبيق لغتي العربية 🎓`;try{navigator.share?navigator.share({text:m}):navigator.clipboard.writeText(m).then(()=>toast("تم النسخ"))}catch(e){toast("تعذّرت المشاركة")}}
function openLesson(i){ls=i;go("lesson")}
function go(v){view=v;if(["home","profile","shop","train","certs"].includes(v))tab=v;if(v=="cert")tab="certs";const m={home,profile,shop,train,certs,cert:certView,track:trackView,lesson:lessonView,quiz:quizView};document.getElementById("app").innerHTML=m[v]()+nav();window.scrollTo(0,0)}
daily();go("home");
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
